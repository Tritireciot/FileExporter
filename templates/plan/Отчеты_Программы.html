<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отчет по использованию программ</title>
    <style>
        @page {
            size: A4 landscape;
            margin: 10mm;
        }

        body {
            font-family: Arial, sans-serif;
            font-size: 11px;
            color: #333333;
            margin: 0;
            padding: 0;
        }

        table {
            width: 100%;
            max-width: 400px; /* Ограничим ширину, так как колонок всего две и они вертикальные */
            border-collapse: collapse;
        }

        th {
            background-color: #f2f2f2;
            color: #000000;
            font-weight: bold;
            font-size: 10px;
            border: 1px solid #cccccc;
            padding: 6px 4px;
            text-align: center;
        }

        td {
            border: 1px solid #cccccc;
            padding: 5px 4px;
            text-align: center;
        }

        .tableLabel {
            text-align: left;
        }
    </style>
</head>
<body>
    <h2>Программы</h2>
    <table>
        <thead>
            <tr>
                <th class="tableLabel">Программы</th>
                <#At#Program[0]#>
                    <#Repeat#ProgramDate#>
                        <th>#ProgramDate.Date | Weekday#</th>
                    </#Repeat#ProgramDate#>
                </#At#Program#>
            </tr>
        </thead>
        <tbody>
            <#Repeat#Program#>
                <tr>
                    <td class="tableLabel">#Program.Name#</td>
                    <#Repeat#ProgramDate#>
                        <td>#ProgramDate.Count#</td>
                    </#Repeat#ProgramDate#>
                </tr>
            </#Repeat#Program#>
        </tbody>
    </table>

</body>
</html>
