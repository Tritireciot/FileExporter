<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отчет по использованию программ</title>
    <style>
        @page {
            size: A4 landscape;
            margin: 10mm;
        }

        body {
            font-family: Arial, sans-serif;
            font-size: 11px;
            color: #333333;
            margin: 0;
            padding: 0;
        }

        /* Блок одной программы */
        .program-block {
            margin-bottom: 25px;
            page-break-inside: avoid; /* Чтобы таблица одной программы не разрывалась некрасиво */
        }

        .program-title {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
            color: #000000;
        }

        table {
            width: 100%;
            max-width: 400px; /* Ограничим ширину, так как колонок всего две и они вертикальные */
            border-collapse: collapse;
        }

        th {
            background-color: #f2f2f2;
            color: #000000;
            font-weight: bold;
            font-size: 10px;
            border: 1px solid #cccccc;
            padding: 6px 4px;
            text-align: center;
        }

        td {
            border: 1px solid #cccccc;
            padding: 5px 4px;
            text-align: center;
        }

        .highlight-col {
            background-color: #f9f9f9;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <#Repeat#Program#>
    <div class="program-block">
        <div class="program-title">
            Программа [#Program.ID#]: #Program.Name#
        </div>
        
        <table>
            <thead>
                <tr>
                    <th style="width: 50%;">Дата</th>
                    <th style="width: 50%;">Количество использований</th>
                </tr>
            </thead>
            <tbody>
                <#Repeat#ProgramDate#>
                <tr>
                    <td class="highlight-col">#ProgramDate.Date#</td>
                    <td>#ProgramDate.Count#</td>
                </tr>
                </#Repeat#ProgramDate#>
            </tbody>
        </table>
    </div>
    </#Repeat#Program#>

</body>
</html>
